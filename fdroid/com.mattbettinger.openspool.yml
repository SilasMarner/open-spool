AutoName: OpenSpool
Summary: Plan reel line capacity — braid, mono & fluoro topshots
Description: |-
    Know exactly how much line your reel holds — before you spool up.

    OpenSpool is a fast, offline line-capacity planner for saltwater
    anglers. Pick your reel, pick your line, and get the yardage in
    seconds — for a straight fill or a backing-plus-topshot mix. No
    account, no tracking, no ads.

    Features:

    * Straight fill — how many yards of any line your spool holds
    * Topshot — set your topshot length and the backing auto-fills the rest
    * Backing/Topshot — set either length and the other adjusts to fill the spool
    * Overflow warnings when a length won't fit
    * Save named favorites and share a plan through any app
    * 120+ reels and 280+ lines from major manufacturers, plus custom entries
    * Standard and Metric units

    Every reel is anchored to a manufacturer-published capacity, then any
    line is converted by the diameter-squared rule used by tackle shops.

